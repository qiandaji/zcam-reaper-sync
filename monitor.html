<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCam E2 多路画面监看</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#111418; color:#e8e8e8; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  header { padding:10px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#1a1f24; border-bottom:1px solid #2a3038; }
  header h1 { font-size:16px; font-weight:600; margin-right:8px; }
  input { flex:1; min-width:220px; max-width:480px; background:#0f1317; border:1px solid #3a424c; color:#fff; border-radius:6px; padding:7px 10px; font-size:14px; }
  button { background:#2563eb; color:#fff; border:none; border-radius:6px; padding:7px 13px; font-size:14px; cursor:pointer; }
  button.secondary { background:#3a424c; }
  button:hover { filter:brightness(1.15); }
  #status { font-size:13px; color:#9aa3ad; margin-left:4px; }
  #stage { flex:1; min-height:0; position:relative; overflow:hidden; background:#000; display:grid; gap:4px; padding:4px; }
  .cell { position:relative; background:#0a0c0e; border-radius:6px; overflow:hidden; min-height:0; min-width:0; }
  .cam { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .tag { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.6); padding:2px 8px; border-radius:4px; font-size:12px; color:#cbd5e1; pointer-events:none; }
  .cell.off .tag { color:#f87171; }
  #hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#6b7480; font-size:14px; line-height:2.2; padding:24px; }
  #hint code { background:#1a1f24; padding:2px 6px; border-radius:4px; color:#9aa3ad; }
  footer { padding:9px 16px; font-size:12px; color:#6b7480; display:flex; gap:16px; flex-wrap:wrap; align-items:center; background:#1a1f24; border-top:1px solid #2a3038; }
  #rtsp { color:#9aa3ad; word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>ZCam E2 监看</h1>
  <input id="ip" placeholder="相机 IP，多台用逗号或换行分隔，如 192.168.1.100,192.168.1.101" autofocus>
  <button id="toggle">连接</button>
  <span id="status">未连接</span>
</header>
<div id="stage">
  <div id="hint">
    输入相机 IP 后回车或点「连接」，多台自动排成网格。<br>
    单台：<code>192.168.1.100</code>　多台：<code>192.168.1.100,192.168.1.101</code><br>
    MJPEG 地址：<code>http://&lt;IP&gt;/mjpeg_stream</code>　Direct 直连默认 IP <code>10.98.32.1</code>
  </div>
</div>
<footer>
  <span>RTSP（VLC/PotPlayer 等）：<span id="rtsp">rtsp://&lt;IP&gt;/live_stream</span></span>
  <button id="copy" class="secondary">复制 RTSP 地址</button>
</footer>
<script>
(function () {
  var ipEl = document.getElementById('ip');
  var stageEl = document.getElementById('stage');
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var rtspEl = document.getElementById('rtsp');
  var KEY = 'zcam_monitor_ips';
  var stopped = false;
  var connected = false;
  var btn = document.getElementById('toggle');

  try { var saved = localStorage.getItem(KEY) || ''; if (saved) ipEl.value = saved; } catch (e) {}

  function parseIps(raw) {
    var out = [], seen = {};
    raw.split(/[,，;；\s\n]+/).forEach(function (tok) {
      tok = tok.trim();
      if (/^\d{1,3}(\.\d{1,3}){3}$/.test(tok) && !seen[tok]) {
        seen[tok] = true;
        out.push(tok);
      }
    });
    return out;
  }

  function colsFor(n) {
    if (n <= 1) return 1;
    if (n === 2) return 2;
    if (n <= 4) return 2;
    if (n <= 9) return 3;
    if (n <= 16) return 4;
    return Math.ceil(Math.sqrt(n));
  }

  function connect() {
    var ips = parseIps(ipEl.value);
    if (!ips.length) {
      statusEl.textContent = '请输入有效 IP，如 192.168.1.100';
      statusEl.style.color = '#f87171';
      ipEl.focus();
      return;
    }
    try { localStorage.setItem(KEY, ipEl.value); } catch (e) {}
    statusEl.textContent = '连接中…';
    statusEl.style.color = '#9aa3ad';
    stopped = false;
    connected = true;
    btn.textContent = '停止';
    hintEl.style.display = 'none';

    var cols = colsFor(ips.length);
    stageEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    stageEl.style.gridAutoRows = '1fr';
    var ts = Date.now();

    ips.forEach(function (ip) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var img = document.createElement('img');
      img.className = 'cam';
      img.alt = ip;
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = ip;
      img.onload = function () { cell.classList.remove('off'); tag.textContent = ip; };
      img.onerror = function () { if (stopped) return; cell.classList.add('off'); tag.textContent = ip + ' 离线'; };
      img.src = 'http://' + ip + '/mjpeg_stream?t=' + ts;
      cell.appendChild(img);
      cell.appendChild(tag);
      stageEl.appendChild(cell);
    });

    var rtspList = ips.map(function (ip) { return 'rtsp://' + ip + '/live_stream'; });
    rtspEl.textContent = rtspList.join('　');
    statusEl.textContent = '监看中 ' + ips.length + ' 台';
    statusEl.style.color = '#34d399';
  }

  function stop() {
    stopped = true;
    connected = false;
    btn.textContent = '连接';
    stageEl.querySelectorAll('.cell').forEach(function (el) { el.remove(); });
    stageEl.style.gridTemplateColumns = '';
    stageEl.style.gridAutoRows = '';
    hintEl.style.display = 'flex';
    rtspEl.textContent = 'rtsp://<IP>/live_stream';
    statusEl.textContent = '已停止';
    statusEl.style.color = '#9aa3ad';
  }

  btn.onclick = function () { if (connected) stop(); else connect(); };
  ipEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(); });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); statusEl.textContent = '已复制 RTSP 地址'; }
    catch (e) { statusEl.textContent = '复制失败，请手动复制'; }
    document.body.removeChild(ta);
  }
  document.getElementById('copy').onclick = function () {
    var url = rtspEl.textContent.replace(/\u3000/g, '\n');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(
        function () { statusEl.textContent = '已复制 RTSP 地址'; },
        function () { fallbackCopy(url); }
      );
    } else {
      fallbackCopy(url);
    }
  };
})();
</script>
</body>
</html>
