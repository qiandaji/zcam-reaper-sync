<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCam E2 画面监看</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#111418; color:#e8e8e8; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  header { padding:10px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#1a1f24; border-bottom:1px solid #2a3038; }
  header h1 { font-size:16px; font-weight:600; margin-right:8px; }
  input { flex:1; min-width:160px; max-width:280px; background:#0f1317; border:1px solid #3a424c; color:#fff; border-radius:6px; padding:7px 10px; font-size:14px; }
  button { background:#2563eb; color:#fff; border:none; border-radius:6px; padding:7px 13px; font-size:14px; cursor:pointer; }
  button.secondary { background:#3a424c; }
  button:hover { filter:brightness(1.15); }
  #status { font-size:13px; color:#9aa3ad; margin-left:4px; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; background:#000; }
  #stream { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; background:#000; display:none; }
  #hint { text-align:center; color:#6b7480; font-size:14px; line-height:2.2; padding:24px; }
  #hint code { background:#1a1f24; padding:2px 6px; border-radius:4px; color:#9aa3ad; }
  footer { padding:9px 16px; font-size:12px; color:#6b7480; display:flex; gap:16px; flex-wrap:wrap; align-items:center; background:#1a1f24; border-top:1px solid #2a3038; }
  #rtsp { color:#9aa3ad; word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>ZCam E2 监看</h1>
  <input id="ip" placeholder="相机 IP，如 192.168.1.100 / 10.98.32.1" autofocus>
  <button id="toggle">连接</button>
  <span id="status">未连接</span>
</header>
<div id="stage">
  <div id="hint">
    输入相机 IP 后回车或点「连接」，自动进入画面监看。<br>
    MJPEG 地址：<code>http://&lt;IP&gt;/mjpeg_stream</code><br>
    相机 Direct 直连模式默认 IP 为 <code>10.98.32.1</code>
  </div>
  <img id="stream" alt="ZCam 实时画面">
</div>
<footer>
  <span>RTSP（VLC/PotPlayer 等）：<span id="rtsp">rtsp://&lt;IP&gt;/live_stream</span></span>
  <button id="copy" class="secondary">复制 RTSP 地址</button>
</footer>
<script>
(function () {
  var ipEl = document.getElementById('ip');
  var streamEl = document.getElementById('stream');
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var rtspEl = document.getElementById('rtsp');
  var KEY = 'zcam_monitor_ip';
  var stopped = false;
  var connected = false;
  var btn = document.getElementById('toggle');

  try { var saved = localStorage.getItem(KEY) || ''; if (saved) ipEl.value = saved; } catch (e) {}

  function connect() {
    var ip = ipEl.value.trim();
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) {
      statusEl.textContent = '请输入有效 IP，如 192.168.1.100';
      statusEl.style.color = '#f87171';
      ipEl.focus();
      return;
    }
    try { localStorage.setItem(KEY, ip); } catch (e) {}
    statusEl.textContent = '连接中…';
    statusEl.style.color = '#9aa3ad';
    hintEl.style.display = 'none';
    streamEl.style.display = 'block';
    stopped = false;
    connected = true;
    btn.textContent = '停止';
    streamEl.src = 'http://' + ip + '/mjpeg_stream?t=' + Date.now();
    rtspEl.textContent = 'rtsp://' + ip + '/live_stream';
  }

  function stop() {
    stopped = true;
    connected = false;
    btn.textContent = '连接';
    streamEl.removeAttribute('src');
    streamEl.style.display = 'none';
    hintEl.style.display = 'block';
    statusEl.textContent = '已停止';
    statusEl.style.color = '#9aa3ad';
  }

  streamEl.onerror = function () {
    if (stopped) return;
    connected = false;
    btn.textContent = '连接';
    statusEl.textContent = '连不上画面：检查 IP / 相机网络模式，或先用浏览器打开 http://' + ipEl.value.trim() + '/info 测试连通';
    statusEl.style.color = '#f87171';
    streamEl.style.display = 'none';
    hintEl.style.display = 'block';
  };
  streamEl.onload = function () {
    connected = true;
    btn.textContent = '停止';
    statusEl.textContent = '监看中';
    statusEl.style.color = '#34d399';
  };

  btn.onclick = function () { if (connected) stop(); else connect(); };
  ipEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(); });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); statusEl.textContent = '已复制 RTSP 地址'; }
    catch (e) { statusEl.textContent = '复制失败，请手动复制'; }
    document.body.removeChild(ta);
  }
  document.getElementById('copy').onclick = function () {
    var url = rtspEl.textContent;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(
        function () { statusEl.textContent = '已复制 RTSP 地址'; },
        function () { fallbackCopy(url); }
      );
    } else {
      fallbackCopy(url);
    }
  };
})();
</script>
</body>
</html>
